name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all-targets

  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-mutants-${{ hashFiles('Cargo.lock') }}

      - name: Install cargo-mutants
        run: |
          if ! command -v cargo-mutants &> /dev/null; then
            cargo install --locked cargo-mutants
          else
            echo "cargo-mutants already cached"
          fi

      - name: Mutation testing
        run: cargo mutants --all-features -v2 --exclude file src/main.rs 2>&1 | tee mutants.log

      - name: Publish mutation summary
        if: always()
        run: |
          {
            echo "## Mutation testing result"
            echo '```'
            grep -E "MISSED|caught|unviable|default" mutants.log || true
            echo '```'
            tail -n 1 mutants.log
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on missed mutants
        if: always()
        run: |
          if grep -q "MISSED" mutants.log; then
            echo "::error::Missed mutants detected — see step summary"
            exit 1
          fi
